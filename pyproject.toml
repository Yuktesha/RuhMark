[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruhmark"
version = "0.1.0"
description = "High-Performance AI Training Corpus Preprocessor, Bilingual Aligner, and Benchmark Suite for LLMs & SLMs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Yuktesha & RuhOS Team", email = "yuktesha@github.com" }
]
keywords = [
    "nlp", "preprocessor", "corpus-cleaning", "bilingual-alignment",
    "llm-training", "slm", "sentence-segmentation", "markitdown-alternative"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/Yuktesha/RuhMark"
Repository = "https://github.com/Yuktesha/RuhMark.git"
"Bug Tracker" = "https://github.com/Yuktesha/RuhMark/issues"

[project.scripts]
ruhmark = "ruhmark.cli:main"
